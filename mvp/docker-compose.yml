# 可选：独立 MySQL，避免占用已有 3306
services:
  mysql:
    image: mysql:8.0
    container_name: qs-takeout-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qs_takeout
    volumes:
      - qs_takeout_mysql:/var/lib/mysql
      - ./sql/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  qs_takeout_mysql:
