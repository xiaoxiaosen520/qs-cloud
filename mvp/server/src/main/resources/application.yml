server:
  port: 8080

spring:
  application:
    name: qs-takeout-server
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/qs_takeout?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      insert-strategy: not_null
      update-strategy: not_null

qs:
  jwt:
    secret: qs-takeout-dev-secret-change-me-32bytes!!
    expire-hours: 720
  sms:
    # true：可用固定验证码 123456；真实验证码见日志
    dev-fixed-code: true
  upload:
    dir: uploads
  order:
    # 超时扫表间隔（毫秒）
    timeout-scan-ms: 15000
  rider:
    # 自有骑手抢单，暂未自招时关闭；后期改 true
    self-enabled: false
  fengniao:
    # true=本地 Mock 推进运单；有开放平台密钥后改 false
    mock: true
    mock-step-ms: 20000
    sandbox: true
    app-id: ""
    secret: ""
    notify-url: http://127.0.0.1:8080/api/delivery/fengniao/notify
    position-source: 3
  pay:
    # App 已接支付宝沙箱；H5 浏览器无支付宝时再改回 true
    mock-enabled: false
    # 沙箱/正式回调都要公网可达；本地用穿透后改这里
    notify-base-url: http://uba99367.natappfree.cc
    wechat:
      # 商户参数配齐后改 true
      enabled: false
      # 未接商户时勿开模拟（避免和支付宝并列出假入口）
      dev-simulate: false
      # 微信开放平台「移动应用」AppID
      app-id: ""
      # 微信支付商户号
      mch-id: ""
      # 商户平台 → API 安全 → APIv3 密钥
      api-v3-key: ""
      # 商户 API 证书序列号
      serial-no: ""
      # 二选一：私钥文件路径，或下面 private-key 内联
      private-key-path: ""
      private-key: ""
      notify-path: /api/pay/notify/wechat
    alipay:
      enabled: true
      sandbox: true
      # 密钥配齐后必须 false，否则仍走模拟
      dev-simulate: false
      app-id: "9021000168678899"
      # 必须填「应用私钥」（密钥工具生成后保存在本地的那把，通常更长、常以 MIIE 开头）
      # 你刚才填的两段都是公钥格式（MIIBIjAN...），私钥不对会签名失败
      private-key: ""
      # 支付宝公钥（开放平台下载的那把，不是应用公钥）
      alipay-public-key: ""
      notify-path: /api/pay/notify/alipay
      return-url: ""
